<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline-variant flex justify-between items-center px-md h-16">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high transition-colors active:opacity-80">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary-container">Visitor Arrived</h1>
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant">
<img alt="Host Profile" class="w-full h-full object-cover" data-alt="A professional corporate headshot of a middle-aged male administrator with a confident expression. He is wearing a tailored navy blue suit and a crisp white shirt, set against a blurred modern office background with soft bokeh lighting. The aesthetic is clean, professional, and consistent with a high-end enterprise security platform." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDx5rywTUF2T0DA4aAc0cB7ShvMtdbsHZuJznPZYPDyG-0K2GvZm8gQuUgYomW_9YUOhJ8fIeS8KOhumOB6X4ZAzri3OcUnXuv6N82renXm5cKTWjO3TKNxTHnSrZX_Kto2_R1BNY-Uu8ILAwn662yc0DW9qB0jrn8YD94XefdADPn7DqdTUHKlkNRgLz5fGkEYOoHS4qY7sPSvKGYP_grXXl-9SKVjfpnIBAQzZ9H-R4Wa26ZjneEEjFlBhDFBRmGfb9MxyZ6F7E8"/>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-20 pb-24 px-md">
<div class="max-w-md mx-auto space-y-lg">
<!-- Main Alert Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-[20px] overflow-hidden shadow-sm visitor-glow">
<!-- Status Badge -->
<div class="px-md pt-md flex justify-end">
<span class="bg-secondary-container/20 text-on-secondary-container text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider border border-secondary/10">
                        Arrived Now
                    </span>
</div>
<!-- Hero Section: Photo & Identity -->
<div class="flex flex-col items-center px-md py-lg text-center">
<div class="w-32 h-32 rounded-full p-1 bg-gradient-to-tr from-secondary to-secondary-container mb-md">
<div class="w-full h-full rounded-full overflow-hidden border-4 border-surface-container-lowest">
<img alt="Jonathan Miller" class="w-full h-full object-cover" data-alt="A high-quality professional portrait of a male executive named Jonathan Miller, wearing a stylish grey blazer and a light blue shirt. He has a friendly and professional demeanor. The lighting is soft and natural, coming from a large window in a contemporary corporate lobby. The image style is polished and sophisticated, emphasizing trust and business professionalism." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDIyIdkXY7UVulJ4RtrjcEt1q_QS-YHjpYtNCzlTknhzprSkirbYK1zIQO5vFXS7-OTG8iQhqdKaM5wx0ZDFNOupoIFFCgyjirjuSiKKqrYRYB_wtMowDMF6PWEiLPL50LL1jE9es4qGA9kkK56prDEaPNa3pZYLIEJltuJU27Kh8MMLEdv_00KKTjadsm3knxlt6jiPJWvfaLHUHyVfannhTkb8F48EZn9L07OjHt_KwsiOF_lhM4AeuSlhuQyNeM8k23E-c2CYZw"/>
</div>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Jonathan Miller</h2>
<p class="font-title-md text-title-md text-on-surface-variant mt-1">TechCorp Solutions</p>
</div>
<!-- Details Grid -->
<div class="px-lg pb-lg border-t border-outline-variant/50 pt-lg space-y-md">
<div class="flex items-start gap-md">
<div class="p-2 bg-surface-container rounded-lg">
<span class="material-symbols-outlined text-primary-container">assignment</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-tighter">Purpose</span>
<span class="font-body-lg text-body-lg text-primary font-medium">Quarterly Product Review</span>
</div>
</div>
<div class="flex items-start gap-md">

<span class="material-symbols-outlined text-primary-container">meeting_room</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-tighter">Location</span>

</div>
</div>
</div>

<!-- Primary Action -->

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">directions_run</span>

                </button>
<!-- Secondary Actions Grid -->
<div class="grid grid-cols-1 gap-sm">
<button class="w-full h-12 bg-surface-container-lowest border border-outline-variant text-primary rounded-[10px] font-title-md text-title-md flex items-center px-md gap-md hover:bg-surface-container-high transition-colors active:bg-surface-container-highest">

<button class="w-full h-12 bg-surface-container-lowest border border-outline-variant text-primary rounded-[10px] font-title-md text-title-md flex items-center px-md gap-md hover:bg-surface-container-high transition-colors active:bg-surface-container-highest">
<span class="material-symbols-outlined text-primary-container">schedule</span>
                        Request 5 Mins
                    </button>
<button class="w-full h-12 bg-surface-container-lowest border border-outline-variant text-primary rounded-[10px] font-title-md text-title-md flex items-center px-md gap-md hover:bg-surface-container-high transition-colors active:bg-surface-container-highest">
<span class="material-symbols-outlined text-primary-container">forward_to_inbox</span>
                        Delegate to Assistant
                    </button>

<span class="material-symbols-outlined">group</span>
<span class="font-label-md text-label-md">Visitors</span>
</a>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">notifications</span>
<span class="font-label-md text-label-md">Alerts</span>
</a>
<!-- Settings Tab -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest transition-all scale-95 active:scale-90" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-md text-label-md">Settings</span>
</a>
</nav>
<script>
        // Micro-interaction for feedback on button clicks
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function() {
                const originalContent = this.innerHTML;
                if (this.innerText.includes("I'm on my way")) {
                    this.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span><span>Notifying Visitor...</span>`;
                    this.classList.add('opacity-80');
                    setTimeout(() => {
                        this.innerHTML = `<span class="material-symbols-outlined">check_circle</span><span>Notified</span>`;
                        this.classList.replace('bg-secondary', 'bg-emerald-700');
                    }, 1200);
                }
            });
        });
    </script>
