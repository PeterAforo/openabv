</div>

<!-- Interactive Layer: Vanilla JS for Micro-interactions -->
<script>
        // Update Clock and Date for Kiosk Realism
        function updateDateTime() {
            const now = new Date();
            
            // Time
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
            
            // Date
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
        }

        setInterval(updateDateTime, 1000);
        updateDateTime();

        // Optional: Simple sound or haptic feedback mock
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                // In a real kiosk this would trigger a click sound or hardware haptic
                console.log('Button Pressed');
            });
        });

        // Atmospheric effect: gentle background drift

            const y = e.clientY / window.innerHeight;

        });
